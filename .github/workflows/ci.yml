name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans every commit, not only the last one.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Downloads the pinned OpenJLPT file, checks its checksum, builds the decks.
      - run: npm run build
      # The grammar content against that file; only the two shelf-map rules need the local CSV, so they're skipped here.
      - run: npm run grammar:check
      # Scans every commit for secrets. Same step as the other repos: installed
      # from the release and checked against the published checksum.
      - name: Install gitleaks, checked against its published checksum
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${archive}$" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - run: gitleaks git --no-banner --redact .
