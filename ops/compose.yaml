# The demo's own Caddy container (D76), next to the server's other sites.
#
# On the server this file sits in the demo's folder, with demo.Caddyfile at
# caddy/Caddyfile and the releases in www/ (see ops/caddy-demo.md). Starting
# or stopping it touches no other site.
services:
  arcade-demo:
    container_name: arcade-demo
    # Caddy 2.11.7, pinned by digest.
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    # Where the front Caddy can reach it, set in .env next to this file;
    # for example ARCADE_DEMO_PUBLISH=172.18.0.1:8092 (the Docker bridge).
    ports:
      ['${ARCADE_DEMO_PUBLISH:?set ARCADE_DEMO_PUBLISH in .env, for example 172.18.0.1:8092}:8080']
    # Folders, not single files: the password command and editors replace
    # files, and a single-file mount would keep showing the old one.
    volumes:
      - ./caddy:/etc/caddy:ro
      - ./www:/srv/arcade:ro
      - /etc/juku-arcade-demo:/secrets:ro
    # No `user:` line: it runs as root, the owner of the root-only hash file.
    # With the other capabilities dropped, root reads a file it owns and
    # nothing that belongs to anyone else.
    read_only: true
    cap_drop: [ALL]
    # Not to bind a low port (8080 isn't one): the image's caddy binary carries
    # this file capability, and with no-new-privileges the kernel refuses to
    # start a binary that would gain a capability the container lacks.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    tmpfs: [/data, /config]
    mem_limit: 64m
    cpus: 0.25
